version: '3.8'

services:
  frontend:
    build: .
    ports:
      - "3000:3000"
    environment:
      - NEWS_SERVICE_URL=http://news-scraper:8001
    depends_on:
      - news-scraper
    restart: unless-stopped

  news-scraper:
    build: ./services/news-scraper
    ports:
      - "8001:8001"
    restart: unless-stopped

networks:
  default:
    driver: bridge
